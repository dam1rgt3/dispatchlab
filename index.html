<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#132b31"><meta name="description" content="Replan a field service day when a technician calls out, a job runs late or an urgent ticket arrives."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%231b383b'/%3E%3Cpath d='M10 13h19v5H10zm6 9h22v5H16zm-6 9h19v5H10z' fill='%23c5ea96'/%3E%3C/svg%3E"><title>DispatchLab · Service board</title><link rel="stylesheet" href="./styles.css"></head>
<body><header class="mast"><div class="wrap nav"><a href="./" class="brand" aria-label="DispatchLab home"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>DispatchLab</a><span class="mast-divider"></span><span class="nav-title">Field operations</span><a class="source" href="https://github.com/dam1rgt3/dispatchlab">GitHub ↗</a></div></header>
<main class="wrap"><section class="heading"><div><p class="eyebrow">Service operations</p><h1>Dispatch board</h1><p class="subtitle">Replan the shift when the day changes.</p></div><div class="shift"><span class="clock-dot"></span><div><b>10:10</b><small>Demo clock · Day shift</small></div></div></section>
<section class="incident-box" aria-labelledby="disruption-title"><div class="incident-top"><h2 id="disruption-title">Introduce a disruption</h2><button class="text-btn" id="toggle-note" aria-expanded="false" aria-controls="intake">Write a dispatch note <span aria-hidden="true">↗</span></button></div><div class="presets" id="presets"></div>
<form id="intake" hidden><label for="note">Dispatch note in English</label><div class="inputrow"><input maxlength="260" id="note" placeholder="Michael called in sick for the rest of the day." autocomplete="off" required><button class="primary">Preview note</button></div><div id="interpretation" aria-live="polite"></div></form></section>
<section class="board card" aria-labelledby="schedule-title"><div class="card-head"><div><p class="eyebrow">Crew timeline</p><h2 id="schedule-title">Day schedule</h2></div><div id="switcher"></div></div><div class="board-scroll" tabindex="0" aria-label="Technician schedule, scroll horizontally for all times"><div id="timeline"></div></div><div class="board-foot"><div class="legend"><span><i class="sw planned"></i>Scheduled</span><span><i class="sw active"></i>In progress</span><span><i class="sw revised"></i>Reassigned</span></div><span id="board-summary"></span></div><div id="job-detail" hidden></div></section>
<section id="workspace" class="workspace" aria-label="Dispatch decisions"></section>
<footer><span>DispatchLab · Field service simulator</span><span>Local demo data · 24-hour clock</span></footer><div id="announce" class="sr" role="status" aria-live="polite"></div><noscript>Enable JavaScript to run the scheduling simulator.</noscript></main>
<script type="module" src="./src/app.mjs"></script></body></html>
